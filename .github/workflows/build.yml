            row "服务器" "Linux x86_64" "lemon-note-$V-linux-amd64.tar.gz"
            row "服务器" "Linux ARM64（树莓派 4/5 64 位系统等）" "lemon-note-$V-linux-arm64.tar.gz"
            row "服务器" "Linux ARMv7（32 位 ARM）" "lemon-note-$V-linux-armv7.tar.gz"
            row "服务器" "Linux x86（32 位）" "lemon-note-$V-linux-386.tar.gz"
            row "服务器" "Linux RISC-V 64" "lemon-note-$V-linux-riscv64.tar.gz"
            row "服务器" "Linux LoongArch 64（龙芯）" "lemon-note-$V-linux-loong64.tar.gz"
            row "服务器" "Linux ppc64le" "lemon-note-$V-linux-ppc64le.tar.gz"
            row "服务器" "Linux s390x" "lemon-note-$V-linux-s390x.tar.gz"
            row "服务器" "Windows 10 / 11 / Server 2016 起，x64" "lemon-note-$V-windows-amd64.zip"
            row "服务器" "Windows 11，ARM64" "lemon-note-$V-windows-arm64.zip"
            row "服务器" "macOS 12 及以上，Apple 芯片 / Intel 通用" "lemon-note-$V-macos-universal.tar.gz"
            echo
            echo "### Docker"
            echo
            echo '```'
            echo "docker run -d --name lemon-note -p 8686:8686 -v lemon-note-data:/data -v lemon-note-cache:/cache ghcr.io/lemonitcn/lemon-note:$V"
            echo '```'
            echo
            echo "linux/amd64、linux/arm64，非 root 运行；数据目录 /data，缓存 /cache。"
            echo
            echo "### 快速开始"
            echo
            echo '1. 带界面版：安装后打开，菜单栏 / 托盘里出现柠檬图标；首次使用在状态窗口里点「打开设置页」，在浏览器里选数据库、创建管理员。'
            echo '2. 命令行版：解压后运行 `./lemon-note`，按提示在浏览器打开带令牌的首次设置地址；`sudo ./lemon-note service install` 装成开机自启的系统服务（Windows 用管理员 PowerShell 运行 `.\lemon-note.exe service install`）。'
            echo '3. 默认地址 http://127.0.0.1:8686。数据目录就是全部数据，备份它即可完整恢复。'
            echo
            if [ "$MAC_NOTARIZED" != true ]; then
              echo "macOS 首次打开如果提示无法验证开发者，到「系统设置 → 隐私与安全性」底部点「仍要打开」；命令行版用 \`xattr -d com.apple.quarantine lemon-note\` 去掉隔离标记。"
              echo
            fi
            echo "校验：[SHA256SUMS]($DL/SHA256SUMS)"
