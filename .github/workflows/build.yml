            echo "## 更新内容"
            echo
            if [ -n "$PREV" ]; then
              git log --no-merges --format='- %s' "$PREV..$GITHUB_SHA" | head -50
            else
              git log --no-merges --format='- %s' "$GITHUB_SHA" | head -50
            fi
          } > notes.md
          cat notes.md

          FLAGS=(--latest)
          case "$V" in *-*) FLAGS=(--prerelease --latest=false) ;; esac
          FILES=(out/*)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${FILES[@]}"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Lemon Note $V" \
              --notes-file notes.md "${FLAGS[@]}" "${FILES[@]}"
          fi
